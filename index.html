<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amz-buy</title>

  <!-- _______________FONT_______________ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">


  <!-- _______________CSS-FACTORY_______________ -->
  <!-- BOX-MODEL -->
  <link rel="stylesheet" href="./factory/general/box-model.css">

  <!-- SCROLL -->
  <link rel="stylesheet" href="./factory/general/scroll.css">

  <!-- INPUT -->
  <link rel="stylesheet" href="./factory/form/dom/input/index.css">

  <!-- BADGE -->
  <link rel="stylesheet" href="./factory/general/dom/badge/index.css">

  <!-- BUTTON -->
  <link rel="stylesheet" href="./factory/general/dom/button/index.css">

  <!-- MODAL -->
  <link rel="stylesheet" href="./factory/modal/index.css">
  <link rel="stylesheet" href="./factory/modal/styles.css">

  <!-- TOAST NOTIFICATIONS -->
  <link rel="stylesheet" href="./factory/toast-notifications/index.css">

  <!-- TABLE -->
  <link rel="stylesheet" href="./factory/table/index.css">
  <link rel="stylesheet" href="./factory/table/styles/black-table.css">

  <!-- _______________CSS-BASE_______________ -->
  <link rel="stylesheet" href="index.css">

  <!-- _______________JS_______________ -->
  <script src="index.js" type="module"></script>

</head>

<body>
  <main id="main">
 
    <svg class="svg-background" xmlns="http://w3.org" viewBox="0 0 1000 650" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Fondo de estudio gris pizarra equilibrado -->
        <linearGradient id="studioBg" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#2a3344" />
          <stop offset="70%" stop-color="#323d52" />
          <stop offset="100%" stop-color="#222a38" />
        </linearGradient>

        <!-- Resplandor de fondo central para dar contraste a la tabla -->
        <radialGradient id="tableGlow" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#435370" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#323d52" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- Base del estudio fotográfico -->
      <rect width="1000" height="650" fill="url(#studioBg)" />
      
      <!-- Resplandor de fondo central (Retroiluminación) -->
      <ellipse cx="500" cy="280" rx="400" ry="250" fill="url(#tableGlow)" />
      
      <!-- Línea de horizonte de estudio desplazada más abajo -->
      <line x1="0" y1="580" x2="1000" y2="580" stroke="#1c2330" stroke-width="1.5" opacity="0.3" />
    </svg>


  </main>
</body>













</html>
